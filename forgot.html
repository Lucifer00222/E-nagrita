<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | e-Citizenship</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #010190 0%, #0000ffad 100%);
      background-size: cover;
      background-repeat: no-repeat;
      height: 100%;
    }

    .container {
      max-width: 400px;
      min-height: 100vh;
      background: #ffffff;
      border: 1px solid #cfd8e3;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      margin: 10px auto;
    }

    .logo {
      width: 35%;
      padding-top: 20px;
      margin: 0 auto;
    }

    .body {
      padding: 25px;
    }

    .body h3 {
      text-align: center;
      color: #0b4ea2;
      margin-bottom: 10px;
    }

    .body p {
      text-align: center;
      font-size: 14px;
      color: #444;
      margin-bottom: 20px;
    }

    .form label {
      font-size: 13px;
      font-weight: bold;
    }

    .form input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 15px 0;
      border: 1px solid #b5c3d1;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;

    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .link {
      text-align: center;
      margin-top: 15px;
    }

    .link a {
      text-decoration: none;
      color: #0b4ea2;
      font-size: 14px;
    }

    .footer {
      background: #f4f6f8;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      color: #666;
      border-top: 1px solid #d6dde6;
      border-radius: 0 0 6px 6px;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .container {
        margin: 10px;
        max-width: 100%;
      }

      .header {
        padding: 12px;
      }

      .header .title {
        font-size: 12px;
      }

      .header .subtitle {
        font-size: 14px;
      }

      .body {
        padding: 20px;
      }

      .body h3 {
        font-size: 18px;
      }

      .body p {
        font-size: 13px;
      }

      .form label {
        font-size: 12px;
      }

      .form input {
        padding: 8px;
        font-size: 13px;
      }

      .form .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-top: 10px;
      }

      .link a {
        font-size: 13px;
      }

      .footer {
        font-size: 11px;
        padding: 8px;
      }
    }

    .gohome a {
      color: black;
      text-decoration: none;
      font-size: 12px;
      padding: 5px;
    }

    .gohome {
      position: relative;
      text-align:right;
    }

    .gohome a:hover {
      color: rgb(44, 44, 207);
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <div class="logo">
      <img src="logo.png" alt="logo" width="100%">
    </div>

    <!-- Body -->
    <div class="body">
      <h3>Forgot Password</h3>
      <p>Please provide the following details to verify your identity and reset your password.</p>

      <form class="form" id="forgotForm">
        <!-- Mobile Number -->
        <label>Registered Mobile Number <span style="color:red;">*</span></label>
        <input type="number" required placeholder="98XXXXXXXX">

        <!-- Email -->
        <label>Email Address (Optional)</label>
        <input type="email" placeholder="example@email.com">

        <!-- Citizenship / Username -->
        <label>Citizenship_ID/National_ID/Username <span style="color:red;">*</span></label>
        <input type="text" required placeholder="Enter Citizenship ID or Username">

        <button type="submit" class="btn">Verify & Continue</button>
        <div class="gohome">
          <a href="login.html">Login</a>
          <a href="index.html">Go to home</a>
        </div>
      </form>

    </div>

    <!-- Footer -->
    <div class="footer">
      © Government of Nepal • Official & Secure System
    </div>
  </div>

</body>

</html>
